name: Enhancement sponsor note

# When an issue is labelled "enhancement", post a one-time note pointing at
# the monthly sponsorship — it helps keep development sustainable and lets
# supporters help prioritise community feature requests. Guarded so it never
# double-posts on re-label.

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  sponsor-note:
    if: github.event.label.name == 'enhancement'
    runs-on: ubuntu-latest
    steps:
      - name: Post sponsor note (once)
        uses: actions/github-script@v7
        env:
          SPONSOR_LOGINS: ${{ secrets.SPONSOR_LOGINS }}
        with:
          script: |
            const marker = '<!-- sem-sponsor-note -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // (13.10.2026) Never ask a sponsor to sponsor, and never put the
            // note on our own issues. Sponsors are listed in the repo SECRET
            // SPONSOR_LOGINS (comma-separated) so private sponsors stay private.
            const author = (context.payload.issue.user.login || '').toLowerCase();
            const sponsors = (process.env.SPONSOR_LOGINS || '').toLowerCase()
              .split(',').map(s => s.trim()).filter(Boolean);
            if (author === owner.toLowerCase() || sponsors.includes(author)) {
              core.info('Author is the maintainer or a sponsor — no note.');
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            if (comments.some(c => c.body && c.body.includes(marker))) {
              core.info('Sponsor note already present — skipping.');
              return;
            }
            const body = [
              marker,
              '💛 **Thanks for the enhancement request!**',
              '',
              'SEM is built and maintained by one person. If this feature matters to you, a',
              '[**monthly sponsorship**](https://github.com/sponsors/traktore-org) keeps development',
              'sustainable and directly helps prioritise community requests like this one.',
              'Every tier is appreciated — thank you for supporting the project!',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
